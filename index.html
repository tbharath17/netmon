<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network stats</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
      }
      body {
        padding: 16px;
      }
      h1 {
        margin: 0 0 12 px;
        height: 28px;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      section {
        flex: 0 0 calc(50% - 8px);
      }
      .chart-box {
        position: relative;
        margin-top: 24px;
      }
      .chart-box canvas {
        position: absolute;
        inset: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 24px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid #ddd;
        font-size: 14px;
      }
      th {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <h1>Network Stats</h1>
    <main>
      <section>
        <h2>Network Monitor</h2>
        <div class="chart-box">
          <canvas id="c"></canvas>
        </div>
      </section>
      <section>
        <h2>Connected IPs</h2>
        <table>
          <thead>
            <tr>
              <th>IP</th>
              <th>Host</th>
              <th>Conns</th>
              <th>Ports</th>
              <th>Process</th>
            </tr>
          </thead>
          <tbody id="peers"></tbody>
        </table>
      </section>
    </main>

    <script src="/chart.js"></script>
    <script defer>
      const N = 60;

      const fmt = (bytes) => {
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + "MB/s";
        if (bytes >= 1024) return (bytes / 1024).toFixed(0) + "KB/s";
        return Math.round(bytes) + "B/s";
      };

      const labels = Array.from({ length: N }, (_, i) => N - 1 - i);

      const chart = new Chart(document.getElementById("c"), {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "In (B/s)",
              data: Array(N).fill(null),
              borderColor: "#16a34a",
            },
            {
              label: "Out (B/s)",
              data: Array(N).fill(null),
              borderColor: "#2563eb",
            },
          ],
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          elements: {
            point: { radius: 0 },
            line: { tension: 0.3, borderWidth: 2 },
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: {
                autoSkip: false,
                maxRotation: 0,
                callback: (v, i) =>
                  i % 10 === 0 || i === N - 1
                    ? labels[i] === 0
                      ? "now"
                      : `-${labels[i]}s`
                    : "",
              },
            },
            y: {
              beginAtZero: true,
              ticks: { callback: (v) => fmt(v), maxTicksLimit: 6 },
            },
          },
          plugins: {
            tooltip: {
              callbacks: {
                title: (items) =>
                  items[0].label === 0 ? "now" : `${items[0].label}s ago`,
                label: (c) => `${c.dataset.label}: ${fmt(c.parsed.y)}`,
              },
            },
          },
        },
      });

      const ws = new WebSocket(`ws://${location.host}`);

      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);

        if (d.type === "stats") {
          chart.data.datasets[0].data.push(d.in);
          chart.data.datasets[1].data.push(d.out);
          chart.data.datasets.forEach((s) => s.data.shift());
          chart.update("none");
        } else if (d.type === "peers") {
          document.getElementById("peers").innerHTML = d.peers
            .map(
              (p) =>
                `<tr><td>${esc(p.ip)}</td><td>${esc(p.host)}</td><td>${p.count}</td><td>${esc(p.ports.join(", "))}</td><td>${esc(p.procs.join(", "))}</td></tr>`,
            )
            .join("");
        }
      };
    </script>
  </body>
</html>
